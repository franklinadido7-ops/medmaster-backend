version: "3.9"

services:
  # ─── Base de données relationnelle ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medmaster
      POSTGRES_PASSWORD: medmaster_password_change_me
      POSTGRES_DB: medmaster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Base vectorielle (RAG) ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medmaster-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API HTTP / dashboard web
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ─── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medmaster-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medmaster:medmaster_password_change_me@postgres:5432/medmaster
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app/app
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
